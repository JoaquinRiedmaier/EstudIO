name: "publish"

on:
  workflow_dispatch:
  push:
    branches:
      - release # O cambia a "main" si prefieres que compile en cada push

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "ubuntu-22.04-arm" # Only available in public repos.
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install

      # Tauri descarga un linuxdeploy de 2024 que mete libwayland-client dentro de la AppImage,
      # y eso rompe el Mesa del sistema en distros nuevas (EGL_BAD_PARAMETER).
      # Si el archivo ya está en ~/.cache/tauri, Tauri no lo descarga y usa este.
      # Ver docs/diagnostico-linux-egl-webkit.md
      - name: linuxdeploy nuevo (no bundlea libwayland-client)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)  SHA=c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d ;;
            aarch64) SHA=620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff ;;
            *) echo "::error::Arquitectura no soportada: $ARCH"; exit 1 ;;
          esac
          mkdir -p ~/.cache/tauri
          F=~/.cache/tauri/linuxdeploy-$ARCH.AppImage
          curl -fsSL -o "$F" "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-$ARCH.AppImage"
          echo "$SHA  $F" | sha256sum -c -
          chmod +x "$F"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ESTUDIO_GOOGLE_CLIENT_ID: ${{ secrets.ESTUDIO_GOOGLE_CLIENT_ID }}
          ESTUDIO_GOOGLE_CLIENT_SECRET: ${{ secrets.ESTUDIO_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: app-v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # tauri-action compila y publica en el mismo paso: esto no frena el release, pero avisa.
      - name: verificar que la AppImage no traiga libwayland-client
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          APPIMAGE=$(ls "$GITHUB_WORKSPACE"/src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          cd "$RUNNER_TEMP"
          "$APPIMAGE" --appimage-extract >/dev/null
          if find squashfs-root -name 'libwayland-client.so*' | grep -q .; then
            echo "::error::La AppImage trae libwayland-client: va a fallar con EGL_BAD_PARAMETER en distros nuevas"
            exit 1
          fi
          echo "OK: la AppImage no trae libwayland-client"
